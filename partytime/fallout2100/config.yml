app:
  name: Fallout 2100 Birthday Party

style: pipboy.css

layout:
  type: vertical
  children:
    - type: tabcard
      layout: horizontal
      selection: single
      defaultOpen: Food
      tabs:
        - name: Food
          id: food
          children:
            - type: tabcard
              layout: vertical
              selection: single
              defaultOpen: Food
              tabs:
                - name: Food
                  id: food
                  description: Food goes here

                - name: Treats
                  id: treats
                  description: Treats go here

                - name: Beverages
                  id: beverages
                  description: Drinks go here

                - name: Dessert
                  id: dessert
                  description: Sugar goes here

        - name: Radio
          id: radio
          children:
            - type: text
              content: Radio goes here

        - name: Map
          id: map
          children:
            - type: image
              image:  map.png
              alt:  map to the Orlando Settlement
              className: "map-screen map-phosphor"

        - name: QUEST
          id: quest
          children:
            - type: html
              content: |
                <h2>SURVIVE THE BIRTHDAY</h2>

                <div class="objective">
                    ☑ Locate Brahmin Burgers
                </div>

                <div class="objective">
                    ☑ Acquire Nuka-Cola
                </div>

                <div class="objective">
                    ☐ Consume Dandy Boy Cake
                </div>

                <div class="objective">
                    ☐ Avoid Deathclaws
                </div>