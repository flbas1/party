app:
  name: Fallout 2100 Birthday Party

style: pipboy.css

layout:
  type: vertical
  children:
    - type: tabcard
      layout: horizontal
      selection: single
      defaultOpen: Food
      tabs:
        - name: Food
          id: food
          children:
            - type: tabcard
              layout: vertical
              selection: single
              defaultOpen: Food
              tabs:
                - name: Food
                  id: food
                  description: Food goes here

                - name: Treats
                  id: treats
                  description: Treats go here

                - name: Beverages
                  id: beverages
                  description: Drinks go here

                - name: Dessert
                  id: dessert
                  description: Sugar goes here

        - name: Radio
          id: radio
          children:
            - type: text
              content: Radio goes here

        - name: Map
          id: map
          children:
            - type: text
              content: Map goes here

        - name: Mission
          id: mission
          children:
            - type: text
              content: Mission goes here