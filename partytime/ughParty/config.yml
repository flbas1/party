app:
  name: Birthday Party

layout:
  type: vertical
  children:
    - type: heading
      content: "PipBoy Countdown"
      level: 2

    - type: countdown
      durationSeconds: 300
      viewMode: digital
      allowViewChange: true
      viewModes:
        - digital
        - compact
        - long
        - date-diff
      color: "#00ff66"
      fontSize: "2rem"

    - type: reveal
      image: "https://static.vecteezy.com/system/resources/previews/050/978/502/large_2x/detective-looking-through-magnifying-glass-solving-a-case-photo.jpg"
      durationSeconds: 30
      direction: center-out
      aspectRatio: "16 / 9"
      cover:
        shape: rectangle
        color: "#173b68"
      showProgress: true
      showCompleteLabel: true 