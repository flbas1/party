app:
  name: Birthday Party

layout:
  type: vertical
  children:
    - type: heading
      content: "PipBoy Countdown"
      level: 2

    - type: countdown
      durationSeconds: 300
      viewMode: digital
      allowViewChange: true
      viewModes:
        - digital
        - compact
        - long
        - date-diff
      color: "#00ff66"
      fontSize: "2rem"